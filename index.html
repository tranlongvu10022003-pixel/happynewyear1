<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>🎆 Happy New Year 🎆</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;

  background: radial-gradient(circle at top,
    #ffd700 0%,
    #ff3b3b 35%,
    #8b0000 70%,
    #000000 100%);
}
#ui{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}
h1{
  font-size:50px;
  text-shadow:0 0 15px gold;
}
#countdown{
  font-size:28px;
  margin-top:10px;
}
input{
  padding:8px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button{
  margin-top:10px;
  padding:8px 18px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
.glow{
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{ text-shadow:0 0 10px red;}
  to{ text-shadow:0 0 25px gold;}
}
canvas{
  position:fixed;
  top:0;left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div id="ui">
  <h1 id="title">🎆 Đếm Ngược Năm Mới 🎆</h1>
  <div id="countdown">Đang đồng bộ thời gian...</div><br>
  <input id="name" placeholder="Nhập tên người nhận"><br>
  <button id="musicBtn">🔊 Bật nhạc</button>
</div>

<!-- 🎵 NHẠC -->
<audio id="countMusic" loop>
  <source src="mucsic/countdown.mp3" type="audio/mpeg">
</audio>

<audio id="tetMusic">
  <source src="mucsic/happy-new-year.mp3" type="audio/mpeg">
</audio>

<script>
/* ================= TIME ================= */
let offset = 0;

async function syncTime(){
  try{
    const r = await fetch("https://worldtimeapi.org/api/timezone/Asia/Ho_Chi_Minh");
    const d = await r.json();
    offset = new Date(d.datetime).getTime() - Date.now();
  }catch{
    offset = 0;
  }
}
function now(){
  return new Date(Date.now() + offset);
}

/* ================= DOM ================= */
const title = document.getElementById("title");
const cd = document.getElementById("countdown");
const nameInput = document.getElementById("name");
const countMusic = document.getElementById("countMusic");
const tetMusic = document.getElementById("tetMusic");
const musicBtn = document.getElementById("musicBtn");

/* ================= MUSIC ================= */
let musicEnabled = false;
let switched = false;

musicBtn.onclick = () => {
  if(!musicEnabled){
    countMusic.play();
    musicBtn.innerText = "🔇 Tắt nhạc";
    musicEnabled = true;
  }else{
    countMusic.pause();
    tetMusic.pause();
    musicBtn.innerText = "🔊 Bật nhạc";
    musicEnabled = false;
  }
};

/* ================= COUNTDOWN ================= */
const target = new Date(Date.now() + 10000); // 10 giây
function tick(){
  const t = now();
  //const target = new Date(`January 1, ${t.getFullYear()+1} 00:00:00`);

  const diff = target - t;

  if(diff <= 0){
    if(!switched){
      switched = true;
      const name = nameInput.value || "BẠN";
      title.innerHTML = `🎊 HAPPY NEW YEAR ${name.toUpperCase()} 🎊`;
      title.classList.add("glow");
      cd.innerHTML = "🎉 Chúc năm mới An Khang – Thịnh Vượng 🎉";

      countMusic.pause();
      if(musicEnabled) tetMusic.play();

      fireworksOn = true;
    }
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;
  cd.innerHTML = `⏳ ${d} ngày ${h} giờ ${m} phút ${s} giây`;
}

/* ================= FIREWORKS ================= */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};

let fireworksOn = false;
let particles = [];

function spawnFirework(){
  const cx = Math.random()*canvas.width;
  const cy = Math.random()*canvas.height/2;

  for(let i=0;i<120;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*5+2;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life:120,
      col:`hsl(${Math.random()*360},100%,60%)`
    });
  }
}

/* ===== LANTERNS ===== */
const lanterns = [];
for(let i=0;i<12;i++){
  lanterns.push({
    x: Math.random()*canvas.width,
    y: canvas.height + Math.random()*canvas.height,
    r: 15 + Math.random()*10,
    speed: 0.3 + Math.random()*0.5
  });
}

function drawLanterns(){
  lanterns.forEach(l=>{
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,0,0,0.85)";
    ctx.arc(l.x, l.y, l.r, 0, Math.PI*2);
    ctx.fill();

    // ánh sáng
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,215,0,0.3)";
    ctx.arc(l.x, l.y, l.r+8, 0, Math.PI*2);
    ctx.fill();

    l.y -= l.speed;
    if(l.y < -50){
      l.y = canvas.height + 50;
      l.x = Math.random()*canvas.width;
    }
  });
}

function animate(){
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawLanterns(); // 🏮 nền Tết

  particles.forEach(p=>{
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x,p.y,3,3);
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life--;
  });

  particles = particles.filter(p=>p.life>0);
  if(fireworksOn && Math.random()<0.08) spawnFirework();

  requestAnimationFrame(animate);
}
animate();

/* ================= START ================= */
(async ()=>{
  await syncTime();
  setInterval(tick,1000);
})();
</script>

</body>
</html>
